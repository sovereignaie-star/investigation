# Render Blueprint (P1-024): one web service from the Dockerfile.
services:
  - type: web
    name: investigation-room
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    autoDeployTrigger: checksPass # deploy only after CI passes
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: IR_DATA_DIR
        value: /data
      - key: IR_VAULT_KEY
        generateValue: true # 256-bit base64 value generated by Render
      - key: IR_ADMIN_TOKEN
        generateValue: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
