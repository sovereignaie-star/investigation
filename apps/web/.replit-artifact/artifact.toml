kind = "web"
previewPath = "/"
title = "Investigation Room"
version = "1.0.0"
id = "artifacts/investigation-room"  # stable Replit artifact id (kept after the P1-001 move)
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22124

[services.development]
run = "pnpm --filter @ir/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@ir/web", "run", "build" ]
publicDir = "apps/web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22124"
BASE_PATH = "/"
