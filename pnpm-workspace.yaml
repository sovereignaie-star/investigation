  "@resvg/resvg-js": ^2.6.2
  tesseract.js: ^7.0.0
  uuid: ^11.1.0
  zod: ^4.6.7

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # P0-022: one yaml version so vite is not instantiated twice (TS2769 in mockup-sandbox vite.config.ts).
  yaml: ^2.9.1
  # P2-033: js-yaml < 4.3.2 has three CPU-exhaustion advisories (merge keys, !!omap); orval 8.22 pins 4.2.0.
  "js-yaml@<4.3.2": ^4.3.2
  # P6-021: patched minimums for transitive deps (Dependabot #79 body-parser, #77 ip-address).
  body-parser: 2.4.0
  ip-address: 10.7.4
  # P6-021: the @jimp packages pin zod ^3.23.8 (no zod-4 line exists); force the
  # patched core in. The selector is GLOBAL for zod@3 but its only consumers in the
  # tree are the @jimp packages (verified: every zod@3 resolution in the lockfile
  # belongs to @jimp/*; the workspace's own zod resolves 4.6.7 via the catalog).
  # Their schemas are plain z.object/z.string, v4-compatible (verified by the
  # jimp-dependent transform tests).
  zod@3: 4.6.7
  # P6-025: patched minimums for transitive deps (Dependabot #84..#86 undici, #80..#83 fast-uri).
  # undici@<8 — only @scalar/json-magic's 7.x line is in the vulnerable range; the tree's
  # other undici (8.12.2, direct) stays untouched. fast-uri is global — its only consumer
  # is ajv@8.20.0.
  "undici@<8": 7.30.1
  fast-uri: 3.1.9
