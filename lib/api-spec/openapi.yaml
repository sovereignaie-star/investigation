openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: engine
    description: Engine run operations (P2-019)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /runs:
    post:
      operationId: submitRun
      tags: [engine]
      summary: Submit a run
      description: Submits a run to the engine and returns its id. The run is queued; its status and phase events are available via the run endpoints.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInput"
      responses:
        "202":
          description: Run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSubmitted"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Admin token required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /runs/{id}:
    get:
      operationId: getRun
      tags: [engine]
      summary: Get run status
      description: Returns the current status and result of a run.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: cancelRun
      tags: [engine]
      summary: Cancel a run
      description: Cancels a queued or running run.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Run cancelling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSubmitted"
        "404":
          description: Run not found or already finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /runs/{id}/events:
    get:
      operationId: runEvents
      tags: [engine]
      summary: Stream run phase events (SSE)
      description: Opens a Server-Sent Events stream of phase transitions for a run. The stream closes when the run reaches a terminal phase or the client disconnects.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RunPhaseEvent"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # P3-003 (طلب أ): the case lifecycle — create with a stated purpose (E-01), list with a state
  # filter (J-17: a locked case shows an identifier only), archive = hide + write-block (J-16),
  # unarchive requires a PurposeConfirmation (E-02 pattern). No delete, ever.
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List cases (J-17 — locked cases appear as identifiers only; archived hidden by default)
      security:
        - adminAuth: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Archived cases are hidden by default (J-16); true lists them too.
      responses:
        "200":
          description: Case summaries. A locked case carries only its identifier, status and timestamps.
          content:
            application/json:
              schema:
                type: object
                required: [cases]
                properties:
                  cases:
                    type: array
                    items:
                      $ref: "#/components/schemas/CaseSummary"
        "401":
          description: Missing or wrong admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a case (UC-01 — a case without a stated purpose is rejected, E-01)
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseInput"
      responses:
        "201":
          description: Created case summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseSummary"
        "400":
          description: Invalid input — e.g. a purpose shorter than 10 characters (E-01 fail-closed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or wrong admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Case detail (J-17 — a locked case returns an explicit message, no content)
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case detail. A locked case carries no content — only the identifier, status and an explicit message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "401":
          description: Missing or wrong admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No case with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateCaseLifecycle
      tags: [cases]
      summary: Lifecycle only — archive / unarchive (J-16). No content modification. No delete.
      description: >-
        Archive sets archivedAt and write-blocks the case (hidden by default). Unarchive is an
        explicit action that REQUIRES a PurposeConfirmation (E-02 pattern — fail-closed without
        one). Archiving an archived case or unarchiving an active case is a conflict (409).
        There is no content modification after archiving, and no delete operation exists.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseLifecycleInput"
      responses:
        "200":
          description: Updated case summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseSummary"
        "400":
          description: Invalid action or body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or wrong admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No case with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Lifecycle conflict — archiving an archived case or unarchiving an active one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unarchive without an explicit PurposeConfirmation (E-02 fail-closed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cases/{id}/stats:
    get:
      operationId: getCaseStats
      tags: [cases]
      summary: Case statistics (P3-012 — the numbers always match the case's own projection)
      description: >-
        The eight projection counts plus the projection seq, taken from ONE snapshot of
        the case's own projection — never a parallel recount. J-17: a locked case fails
        closed with 403 and the locked message — never zeros that look like statistics.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The case's projection seq and counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStats"
        "401":
          description: Missing or wrong admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: J-17 — the case is locked-encrypted; not even a count is readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No case with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cases/{id}/projection:
    get:
      operationId: getCaseProjection
      tags: [cases]
      summary: Case projection (P3-015 — the data path of re-opening a saved case after restart)
      description: >-
        The case's own projection snapshot — the exact shape `ir project --json` emits
        ({...projection, sha256}) — served as plain JSON for the workbench's saved-
        investigations flow. The graph the workbench renders after a restart comes from
        this snapshot of the case itself, never a browser rebuild. J-17: a locked case
        fails closed with 403 and the locked message — never an empty graph that looks
        like an opened case.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Case id (ULID).
      responses:
        "200":
          description: The case's projection snapshot with its sha256.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseExport"
        "401":
          description: Missing or wrong admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: J-17 — the case is locked-encrypted; nothing is readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No case with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cases/{id}/export/{format}:
    get:
      operationId: getCaseExport
      tags: [cases]
      summary: Case export (P3-014 — the projection snapshot JSON, the format available in this phase)
      description: >-
        The phase's export format: the case's projection snapshot JSON — the exact shape
        `ir project --json` emits ({...projection, sha256}), taken from ONE snapshot of the
        case's own projection. The file is a projection snapshot, NOT a full copy of the case
        and its evidence. J-17: a locked case fails closed with 403. An unsupported format is
        an explicit 400 naming the supported formats — never a silent fallback.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Case id (ULID).
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [projection]
          description: The export format — only the phase's available format is supported.
      responses:
        "200":
          description: The projection snapshot JSON as a download (attachment).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseExport"
        "400":
          description: Unsupported format — the error names the supported formats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or wrong admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: J-17 — the case is locked-encrypted; nothing is exported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No case with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cases/{id}/evidence/{evidenceId}:
    get:
      operationId: getCaseEvidence
      tags: [cases]
      summary: Raw evidence content (P3-010 — the safe raw viewer's data path from the P1-010 blobs)
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Case id (ULID).
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
          description: Evidence id (ULID).
      responses:
        "200":
          description: >
            The evidence envelope. Textual evidence (HTML, JSON, plain text...) arrives decoded as
            UTF-8 in `content`; binary evidence arrives with `encoding: "binary"` and an empty
            `content` — the raw viewer refuses to corrupt it (declared limit). Every read
            re-verifies the blob's content hash (T-LED-019).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceContentEnvelope"
        "401":
          description: Missing or wrong admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Locked (encrypted) case — fail-closed with the J-17 message, no content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown case or evidence id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Evidence larger than the raw-viewer cap (16 MiB) — metadata only, never partial content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Evidence read failed (missing or corrupt blob) — fail-closed, never partial content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    adminAuth:
      type: http
      scheme: bearer
      description: IR_ADMIN_TOKEN bearer token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RunInput:
      type: object
      properties:
        kind:
          type: string
        canonicalInput:
          type: string
        priority:
          type: number
        depth:
          type: number
        costEstimate:
          type: number
      required:
        - kind
        - canonicalInput
    RunSubmitted:
      type: object
      properties:
        runId:
          type: string
        status:
          type: string
      required:
        - runId
        - status
    RunResult:
      type: object
      properties:
        runId:
          type: string
        phase:
          type: string
          enum: [queued, running, cancelled, failed, succeeded]
        processed:
          type: number
        transportAttempts:
          type: number
        failure:
          nullable: true
          type: object
      required:
        - runId
        - phase
        - processed
        - transportAttempts
    RunPhaseEvent:
      type: object
      properties:
        runId:
          type: string
        phase:
          type: string
          enum: [queued, running, cancelled, failed, succeeded]
      required:
        - runId
        - phase
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        size:
          type: number
          description: Present on 413 — the refused evidence's size in bytes.
    EvidenceContent:
      type: object
      description: >-
        The raw evidence record as served to the viewer (P3-010). `encoding` is "utf-8" for
        textual evidence with the decoded `content`, or "binary" for anything else — the
        raw viewer refuses to corrupt binary bytes, so `content` is empty and only the
        metadata travels (declared limit).
      required: [id, mime, sha256, size, fetchedAt, transformId, encoding, content]
      properties:
        id:
          type: string
          description: Evidence id (ULID).
        mime:
          type: string
        sha256:
          type: string
          description: Hex SHA-256 of the stored content — integrity, verifiable by the caller.
        size:
          type: number
          description: Blob size in bytes.
        fetchedAt:
          type: string
          format: date-time
        transformId:
          type: string
        encoding:
          type: string
          enum: [utf-8, binary]
        content:
          type: string
          description: The decoded UTF-8 text for textual evidence; empty for binary.
    EvidenceContentEnvelope:
      type: object
      required: [evidence]
      properties:
        evidence:
          $ref: "#/components/schemas/EvidenceContent"
    CaseSummary:
      type: object
      description: >-
        A case as it appears in a listing. J-17: a locked-encrypted case carries ONLY id,
        status, encrypted, createdAt and lastActivityAt — its content fields are null.
      required: [id, title, purpose, legalBasis, createdAt, archivedAt, sensitivity, tags, encrypted, status, lastActivityAt]
      properties:
        id:
          type: string
        title:
          type: [string, "null"]
        purpose:
          type: [string, "null"]
        legalBasis:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: J-16 — null while the case is active.
        sensitivity:
          type: [string, "null"]
        tags:
          type: [array, "null"]
          items:
            type: string
        encrypted:
          type: boolean
        status:
          type: string
          enum: [active, archived, locked-encrypted]
        lastActivityAt:
          type: [string, "null"]
          format: date-time
    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/CaseSummary"
        - type: object
          properties:
            retention:
              type: [string, "null"]
              description: The retention policy object; null for a locked case.
            ownerId:
              type: [string, "null"]
            message:
              type: [string, "null"]
              description: J-17 — for a locked case, the explicit locked message; null when readable.
    CaseStats:
      type: object
      required: [seq, counts]
      properties:
        seq:
          type: integer
          description: The last ledger seq included in the projection snapshot (-1 for an empty chain).
        counts:
          type: object
          required: [entities, nodes, claims, edges, observations, evidence, merges, notes]
          properties:
            entities:
              type: integer
            nodes:
              type: integer
              description: Graph nodes — after merges, fewer than entities.
            claims:
              type: integer
            edges:
              type: integer
            observations:
              type: integer
            evidence:
              type: integer
            merges:
              type: integer
            notes:
              type: integer
    CaseExport:
      type: object
      required: [seq, graph, table, coverage, counts, sha256]
      description: >-
        The case's projection snapshot — the same shape `ir project --json` emits. The
        precise shape of each view is owned by @ir/ledger's projections (the source of
        truth); this contract pins the top level.
      properties:
        seq:
          type: integer
          description: The last ledger seq included in the snapshot (-1 for an empty chain).
        graph:
          type: object
          description: The graph view (nodes and edges) as produced by @ir/ledger's graphView.
          additionalProperties: true
        table:
          type: array
          description: The table view rows as produced by @ir/ledger's tableView.
          items:
            type: object
            additionalProperties: true
        coverage:
          type: object
          description: The coverage view as produced by @ir/ledger's coverageView.
          additionalProperties: true
        networkLog:
          type: object
          description: The network log view as produced by @ir/ledger's networkLogView.
          additionalProperties: true
        counts:
          type: object
          required: [entities, nodes, claims, edges, observations, evidence, merges, notes]
          properties:
            entities:
              type: integer
            nodes:
              type: integer
            claims:
              type: integer
            edges:
              type: integer
            observations:
              type: integer
            evidence:
              type: integer
            merges:
              type: integer
            notes:
              type: integer
        sha256:
          type: string
          description: The projection hash (JCS SHA-256) of this exact snapshot — the file carries its own integrity fingerprint.
    CreateCaseInput:
      type: object
      required: [title, purpose, legalBasis]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        purpose:
          type: string
          minLength: 10
          maxLength: 2000
          description: E-01 — a case without a stated purpose is rejected.
        legalBasis:
          type: string
          enum:
            [
              due_diligence,
              fraud_investigation,
              security_incident,
              threat_intelligence,
              journalism,
              litigation_support,
              compliance_kyc,
              academic_research,
              self_assessment,
              training_simulation,
            ]
        passphrase:
          type: string
          description: Optional — creates the case encrypted at rest (locked without the passphrase).
        retention:
          type: object
          description: Optional retention policy (defaults to indefinite).
        sensitivity:
          type: string
          enum: [standard, sensitive, restricted]
        tags:
          type: array
          items:
            type: string
    UpdateCaseLifecycleInput:
      type: object
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [archive, unarchive]
        reason:
          type: string
          minLength: 3
          description: Kept in the case chain with the lifecycle update.
        purposeConfirmation:
          type: string
          minLength: 10
          description: E-02 pattern — REQUIRED for unarchive (fail-closed without it).
