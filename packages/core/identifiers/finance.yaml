- id: iban
  category: Finance
  labels:
    en: IBAN (Bank Account)
    ar: رقم IBAN المصرفي
  description: International Bank Account Number
  icon: 🏦
  color: green
  patterns:
    - ^[A-Z]{2}\d{2}[A-Z0-9]{4}\d{7}([A-Z0-9]?){0,16}$
  validator: iban
  examples:
    positive:
      - DE89370400440532013000
    negative:
      - DE89370400440532013000#
  sensitivity: normal
