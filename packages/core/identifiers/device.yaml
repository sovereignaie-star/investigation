- id: imei
  category: Device
  labels:
    en: IMEI Number
    ar: رقم IMEI
  description: International Mobile Equipment Identity
  icon: 📱
  color: blue
  patterns:
    - ^\d{15}$
  validator: luhn
  examples:
    positive:
      - "490154203237518"
    negative:
      - 490154203237518#
  sensitivity: normal
