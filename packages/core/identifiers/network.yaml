# Identifier catalog: Network (25 types). Schema: IdentifierSpec in @ir/schema (5.6).
# Edit here, then run: pnpm --filter @ir/core run gen:data
- id: ipv4
  category: Network
  labels:
    en: IPv4 Address
    ar: عنوان IPv4
  description: IPv4 network address
  icon: 🌐
  color: cyan
  patterns:
    - ^(\d{1,3}\.){3}\d{1,3}$
  validator: ip
  examples:
    positive:
      - 192.168.1.1
      - 8.8.8.8
    negative:
      - 192.168.1.1#
  sensitivity: normal
  transforms:
    - ipinfo
    - shodan
    - virustotal
    - abuseipdb
- id: ipv6
  category: Network
  labels:
    en: IPv6 Address
    ar: عنوان IPv6
  description: IPv6 network address
  icon: 🌐
  color: cyan
  patterns:
    - ^(?=[0-9A-Fa-f:.]*:)[0-9A-Fa-f:.]{2,45}$
  validator: ip
  examples:
    positive:
      - 2001:db8::1
    negative:
      - 2001:db8::1#
  sensitivity: normal
- id: cidr
  category: Network
  labels:
    en: CIDR Block
    ar: CIDR
  description: IP network range in CIDR notation
  icon: 🔗
  color: cyan
  patterns:
    - ^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$
  validator: null
  examples:
    positive:
      - 192.168.0.0/24
    negative:
      - 192.168.0.0/24#
  sensitivity: normal
