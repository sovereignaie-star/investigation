  description: A free-text postal address (not an identifier; used as geocoding input only)
  icon: 📍
  color: gray
  patterns:
    - ^\d{1,6}\s+[A-Za-z][A-Za-z0-9.,\-\s]{2,200}$
  validator: null
  examples:
    positive:
      - "1600 Amphitheatre Parkway, Mountain View, CA"
    negative:
      - "ab"
  context:
    keywords:
      - address
      - location
      - street
      - postal
      - geo
      - عنوان
      - موقع
    required: true
  sensitivity: normal
