- id: geo_point
  category: Network
  labels:
    en: Geographic Coordinates
    ar: إحداثيات جغرافية
  description: A "lat,lng" pair in decimal degrees (WGS84), each in its documented range
  icon: 🌍
  color: green
  patterns:
    - ^-?(?:[0-8]?\d|90)(?:\.\d{1,8})?,-?(?:(?:1?[0-7]?\d)|(?:180))(?:\.\d{1,8})?$
  validator: null
  examples:
    positive:
      - "21.4225,39.8262"
      - "-33.8688,151.2093"
      - "0.0,0.0"
    negative:
      - "91.0,10.0"
      - "10.0,181.0"
  sensitivity: normal
- id: street_address
  category: Network
