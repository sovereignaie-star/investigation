- id: jwt_token
  category: API
  labels:
    en: JWT Token
    ar: رمز JWT
  description: JSON Web Token (Bearer token)
  icon: 🔑
  color: purple
  patterns:
    - ^eyJ[A-Za-z0-9_\-]+\.eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+$
  validator: null
  examples:
    positive:
      - eyJ{{12:a}}.eyJ{{12:b}}.{{16:c}}
    negative:
      - eyJ{{12:a}}.eyJ{{12:b}}.{{16:c}}#
  sensitivity: normal
