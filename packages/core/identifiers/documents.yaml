# Identifier catalog: Documents (53 types). Schema: IdentifierSpec in @ir/schema (5.6).
# Edit here, then run: pnpm --filter @ir/core run gen:data
- id: eu_reference
  category: Documents
  labels:
    en: EU Sanctions Reference Number
    ar: رقم مرجعي عقوبات الاتحاد الأوروبي
  description: The EU consolidated financial sanctions list reference number (EU.n.n format)
  icon: 🇪🇺
  color: blue
  patterns:
    - ^EU\.\d{1,4}\.\d{1,5}$
  validator: null
  examples:
    positive:
      - "EU.27.28"
      - "EU.39.56"
    negative:
      - "EU.27.28.99"
  sensitivity: natural_person_gate
- id: un_reference
  category: Documents
  labels:
    en: UN SC Reference Number
    ar: رقم مرجعي مجلس الأمن
  description: The UN Security Council Consolidated List reference number (regime code + i/e + serial)
  icon: 🕊️
  color: blue
  patterns:
    - ^[A-Z]{2,3}[ie]\.\d{3,6}$
  validator: null
  examples:
    positive:
      - "CTi.47018"
      - "QDi.224"
      - "LYi.001"
      - "LYe.001"
    negative:
      - "CTi.47"
  sensitivity: natural_person_gate
- id: sdn_uid
  category: Documents
  labels:
    en: OFAC SDN UID
    ar: معرّف قائمة العقوبات SDN
  description: The OFAC Specially Designated Nationals (SDN) list entry UID
  icon: ⚖️
  color: red
  patterns:
    - ^\d{1,10}$
  validator: null
  examples:
    positive:
      - "36"
      - "9754"
    negative:
      - "9754A"
  sensitivity: normal
- id: person_name
  category: Documents
  labels:
    en: Person Full Name
    ar: اسم شخص كامل
  description: A free-text person name (used as a sanctions-screening subject; not an entity id)
  icon: 👤
  color: gray
  patterns:
    - ^[\p{L}][\p{L}'’.-]*(?:\s[\p{L}][\p{L}'’.-]*)+$
  flags: u
  validator: null
  examples:
    positive:
      - "John Smith"
      - "Ahmed Al-Sayed"
    negative:
      - "ab"
      - "12345"
  context:
    keywords:
      - name
      - person
      - full name
      - individual
      - subject
      - sanctions
      - اسم
      - شخص
    required: true
  sensitivity: natural_person_gate
