- id: mx_record
  category: Domain
  labels:
    en: MX Record
    ar: سجل MX
  description: Mail exchange DNS record
  icon: 📬
  color: blue
  patterns:
    - ^\d+\s+[a-zA-Z0-9.\-]+$
  validator: psl
  examples:
    positive:
      - 10 mail.example.com
    negative:
      - 10 mail.example.com#
  sensitivity: normal
- id: txt_record
  category: Domain
  labels:
    en: TXT Record
    ar: سجل TXT
  description: DNS TXT record (SPF, DKIM, DMARC)
  icon: 📝
  color: yellow
  patterns:
    - ^"[^"]+"$
  validator: null
  examples:
    positive:
      - '"v=spf1 include:_spf.google.com ~all"'
    negative:
      - '"v=spf1 include:_spf.google.com ~all"#'
  sensitivity: normal
