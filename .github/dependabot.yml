# P0-017: dependency updates. Bot commits are allowed by the governance guard only
# when the PR also carries a governed commit that updates docs/STATUS.md and docs/WORKLOG.md (GR-01).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    ignore:
      # P0-029: recharts 3 breaks the vendored shadcn chart.tsx (TS2339 payload/label). Revisit when
      # mockup-sandbox moves to packages/ui in phase 3 and the chart component is regenerated.
      - dependency-name: recharts
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Asia/Riyadh
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, ci]
