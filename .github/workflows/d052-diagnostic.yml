name: d052-diagnostic
# D-052 diagnostic (P1-028): run the ORIGINAL audit-purpose.test.ts D-052 tests on CI
# with per-variant timing so the owner can see the real numbers from a GitHub runner.
# Triggered manually or by a PR; NEVER on a schedule and NEVER on push to main.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/store/src/audit-purpose.test.ts"
      - "packages/store/src/case.ts"
      - "packages/store/src/crypto.ts"
      - ".github/workflows/d052-diagnostic.yml"
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report runner specs
        run: |
          echo "=== runner ==="
          nproc
          free -m | head -3
          node --version
      - name: Run the ORIGINAL D-052 tests (encrypted + plain) with timing
        run: |
          # No --testTimeout changes, no --bail, no retries: the ORIGINAL test as-is.
          # vitest reports per-test duration in the verbose reporter.
          pnpm vitest run packages/store/src/audit-purpose.test.ts --reporter=verbose 2>&1 | tee d052-verbose.log
      - name: Extract D-052 test durations
        if: always()
        run: |
          echo "=== D-052 durations (seconds) ==="
          grep -E "encrypted: a creation that fails|plain: a creation that fails" d052-verbose.log || echo "no match"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d052-verbose-log
          path: d052-verbose.log
