name: governance
# GR-01..GR-05, GR-09, GR-13, GR-15: every commit must update docs/STATUS.md + docs/WORKLOG.md and cite a task id.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard unit tests
        run: node --test scripts/governance/
      - name: ROADMAP <-> STATUS consistency
        run: node scripts/governance/check.mjs --consistency
      - name: Every commit updates the docs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER~1..$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "Checking $RANGE"
          node scripts/governance/check.mjs --range "$RANGE"
