name: governance
# GR-01..GR-05, GR-09, GR-13, GR-15, GR-16: every commit must update docs/STATUS.md + docs/WORKLOG.md and cite a task id.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install toolchain deps for guards that execute repo code
        run: pnpm install --frozen-lockfile
      - name: Guard unit tests
        run: node --test scripts/governance/check.test.mjs scripts/governance/asvs.test.mjs scripts/governance/threat-model.test.mjs scripts/governance/fuzz.test.mjs scripts/governance/deps.test.mjs scripts/governance/test-ports.test.mjs scripts/governance/dpia.test.mjs scripts/governance/perf.test.mjs scripts/governance/backup.test.mjs scripts/governance/delete.test.mjs scripts/governance/check-pr-title.test.mjs scripts/governance/licenses.test.mjs scripts/governance/legal.test.mjs
      - name: ASVS L2 checklist guard (P6-001)
        run: node --test scripts/governance/asvs.test.mjs scripts/governance/check.test.mjs scripts/governance/threat-model.test.mjs scripts/governance/fuzz.test.mjs scripts/governance/deps.test.mjs scripts/governance/test-ports.test.mjs scripts/governance/dpia.test.mjs scripts/governance/perf.test.mjs scripts/governance/backup.test.mjs scripts/governance/delete.test.mjs scripts/governance/check-pr-title.test.mjs scripts/governance/licenses.test.mjs scripts/governance/legal.test.mjs
      - name: STRIDE threat model guard (P6-002)
        run: node --test scripts/governance/threat-model.test.mjs scripts/governance/check.test.mjs scripts/governance/asvs.test.mjs scripts/governance/fuzz.test.mjs scripts/governance/deps.test.mjs scripts/governance/test-ports.test.mjs scripts/governance/dpia.test.mjs scripts/governance/perf.test.mjs scripts/governance/backup.test.mjs scripts/governance/delete.test.mjs scripts/governance/check-pr-title.test.mjs scripts/governance/licenses.test.mjs scripts/governance/legal.test.mjs
      - name: Fuzz campaign guard (P6-004)
        run: node --test scripts/governance/fuzz.test.mjs scripts/governance/deps.test.mjs scripts/governance/test-ports.test.mjs scripts/governance/dpia.test.mjs scripts/governance/check.test.mjs scripts/governance/asvs.test.mjs scripts/governance/threat-model.test.mjs scripts/governance/perf.test.mjs scripts/governance/backup.test.mjs scripts/governance/delete.test.mjs scripts/governance/check-pr-title.test.mjs scripts/governance/licenses.test.mjs scripts/governance/legal.test.mjs
      - name: Performance ceilings guard (P6-006)
        run: node --test scripts/governance/perf.test.mjs scripts/governance/check.test.mjs scripts/governance/asvs.test.mjs scripts/governance/threat-model.test.mjs scripts/governance/fuzz.test.mjs scripts/governance/deps.test.mjs scripts/governance/test-ports.test.mjs scripts/governance/dpia.test.mjs scripts/governance/backup.test.mjs scripts/governance/delete.test.mjs scripts/governance/check-pr-title.test.mjs scripts/governance/licenses.test.mjs scripts/governance/legal.test.mjs
      - name: Backup/restore guard (P6-007)
        run: node --test scripts/governance/backup.test.mjs scripts/governance/check.test.mjs scripts/governance/asvs.test.mjs scripts/governance/threat-model.test.mjs scripts/governance/fuzz.test.mjs scripts/governance/deps.test.mjs scripts/governance/test-ports.test.mjs scripts/governance/dpia.test.mjs scripts/governance/perf.test.mjs scripts/governance/delete.test.mjs scripts/governance/check-pr-title.test.mjs scripts/governance/licenses.test.mjs scripts/governance/legal.test.mjs
      - name: Secure deletion guard (P6-008)
        run: node --test scripts/governance/delete.test.mjs scripts/governance/check.test.mjs scripts/governance/asvs.test.mjs scripts/governance/threat-model.test.mjs scripts/governance/fuzz.test.mjs scripts/governance/deps.test.mjs scripts/governance/test-ports.test.mjs scripts/governance/dpia.test.mjs scripts/governance/perf.test.mjs scripts/governance/backup.test.mjs scripts/governance/check-pr-title.test.mjs scripts/governance/licenses.test.mjs scripts/governance/legal.test.mjs
      - name: PR title carries a task id (P6-017)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --test scripts/governance/check-pr-title.test.mjs && node scripts/governance/check-pr-title.mjs scripts/governance/check.test.mjs scripts/governance/asvs.test.mjs scripts/governance/threat-model.test.mjs scripts/governance/fuzz.test.mjs scripts/governance/deps.test.mjs scripts/governance/test-ports.test.mjs scripts/governance/dpia.test.mjs scripts/governance/perf.test.mjs scripts/governance/backup.test.mjs scripts/governance/delete.test.mjs scripts/governance/licenses.test.mjs scripts/governance/legal.test.mjs
      - name: ROADMAP <-> STATUS <-> MASTER_PLAN consistency
        run: node scripts/governance/check.mjs --consistency
      - name: D-8 security review gate unit tests (D-8, P2-003)
        run: node --test scripts/gates/security-review-gate.test.mjs scripts/governance/check.test.mjs scripts/governance/asvs.test.mjs scripts/governance/threat-model.test.mjs scripts/governance/fuzz.test.mjs scripts/governance/deps.test.mjs scripts/governance/test-ports.test.mjs scripts/governance/dpia.test.mjs scripts/governance/perf.test.mjs scripts/governance/backup.test.mjs scripts/governance/delete.test.mjs scripts/governance/check-pr-title.test.mjs scripts/governance/licenses.test.mjs scripts/governance/legal.test.mjs
      - name: Every commit updates the docs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER~1..$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "Checking $RANGE"
          node scripts/governance/check.mjs --range "$RANGE"
