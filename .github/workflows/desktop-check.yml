name: desktop-check

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-check.yml"

jobs:
  cargo-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo check the desktop shell (P7-004)
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked 2>/dev/null || cargo check
