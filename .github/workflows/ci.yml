name: ci
# P0-011: install, typecheck, build and test on every PR and push to main.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (P0-022)
        run: pnpm run lint
      - run: pnpm run typecheck
      - name: Build all packages
        run: pnpm -r --if-present run build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  docker:
    # P1-024: the single-service image must build and answer its health check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t investigation-room .
      - run: |
          docker run -d --name ir -p 8080:8080 investigation-room
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/api/healthz
          curl -fsS http://localhost:8080/ | grep -q '<html lang="ar" dir="rtl">'
          docker logs ir
          docker run --rm investigation-room node ir.mjs --help
