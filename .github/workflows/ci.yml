name: ci
# P0-011: install, typecheck, build and test on every PR and push to main.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (P0-022)
        run: pnpm run lint
      - run: pnpm run typecheck
      - name: Build all packages
        run: pnpm -r --if-present run build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  docker:
    # P1-024: the single-service image must build and answer its health check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t investigation-room .
      - run: |
          docker run -d --name ir -p 8080:8080 -e IR_ADMIN_TOKEN=ci-admin-token investigation-room
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/api/healthz
          curl -fsS http://localhost:8080/ | grep -q '<html lang="ar" dir="rtl">'
          docker logs ir
          docker run --rm investigation-room node ir.mjs --help
          # a request without the explicitly configured token is refused, even from the container loopback
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/vault)" = 401
          # the configured token is required for vault management; the secret never comes back
          docker exec ir node -e "const b='http://127.0.0.1:8080/api/vault';const h={'content-type':'application/json',authorization:'Bearer ci-admin-token'};fetch(b+'/ipinfo',{method:'PUT',headers:h,body:JSON.stringify({secret:'ci-secret-value-1'})}).then(r=>{if(!r.ok)process.exit(1);return fetch(b,{headers:{authorization:'Bearer ci-admin-token'}})}).then(r=>r.text()).then(t=>{if(t.includes('ci-secret-value-1')||!t.includes('\"configured\":true'))process.exit(1)})"
