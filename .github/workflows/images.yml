# P7-002: signed multi-arch images. A v* tag (or a manual dispatch for the
# trial acceptance) builds linux/amd64+linux/arm64, pushes to GHCR, signs
# the multi-arch index digest with keyless cosign (GitHub OIDC), then
# verifies the signature against the strict certificate identity (this
# repository, this workflow file, the exact ref) and inspects the index.
# P7-003: the build also attests an SBOM and SLSA provenance; both are
# verified with cosign and the SBOM file is attached to the v* release.
name: images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach the SBOM to the v* GitHub release
  id-token: write # keyless cosign (OIDC)
  packages: write # GHCR push

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags and signer identity
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "identity=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/images.yml@${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          else
            # trial acceptance run (workflow_dispatch): a SHA-bound tag that
            # never touches published release tags or latest
            TRIAL="trial-$(git rev-parse --short HEAD)"
            echo "tags=${IMAGE}:${TRIAL}" >> "$GITHUB_OUTPUT"
            echo "identity=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/images.yml@${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push the multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the multi-arch index digest (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Verify the signature (strict identity)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity "${{ steps.meta.outputs.identity }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Inspect the pushed index (both platforms)
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
      - name: Generate the CycloneDX SBOM (P7-003)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft "${IMAGE}@${{ steps.build.outputs.digest }}" --platform linux/amd64 -o cyclonedx-json > sbom.cdx.json
          head -c 300 sbom.cdx.json
      - name: Attest the SBOM to the image index (P7-003)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Download the SBOM attestation back (verifiable, P7-003)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # cosign download sbom is the deprecated platform-attachment path;
          # attestation-based SBOMs are retrieved with download attestation
          cosign download attestation "${IMAGE}@${{ steps.build.outputs.digest }}" > attestation.cdx.json
          test -s attestation.cdx.json
          jq -r .payload attestation.cdx.json | base64 -d | jq -e '.predicateType == "https://cyclonedx.org/bom"'
      - name: Verify the SBOM attestation signature (P7-003)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "${{ steps.meta.outputs.identity }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Verify the buildx SLSA provenance layer in the index (P7-003)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # buildx pushes provenance as in-toto layers inside the index;
          # assert a layer carries the SLSA predicate type
          # anonymous GHCR token flow can be rate-limited from shared runner IPs:
          # fetch with retries and fail loudly with diagnostics
          TOKEN=""
          for i in 1 2 3 4 5; do
            TOKEN="$(curl -sS --retry 3 --retry-delay 5 "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY}:pull" | jq -r .token)"
            [ -n "${TOKEN}" ] && [ "${TOKEN}" != "null" ] && break
            echo "token fetch attempt ${i} failed; waiting 15s"; sleep 15
          done
          [ -n "${TOKEN}" ] && [ "${TOKEN}" != "null" ] || { echo "could not obtain an anonymous GHCR pull token"; exit 1; }
          INDEX_JSON=""
          for i in 1 2 3; do
            INDEX_JSON="$(curl -sS --retry 3 --retry-delay 5 -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.oci.image.index.v1+json" "https://ghcr.io/v2/${GITHUB_REPOSITORY}/manifests/${{ steps.build.outputs.digest }}")"
            echo "${INDEX_JSON}" | jq -e .manifests >/dev/null 2>&1 && break
            echo "index fetch attempt ${i} failed; waiting 15s"; sleep 15
          done
          echo "${INDEX_JSON}" | jq -e .manifests >/dev/null || { echo "could not fetch the image index: ${INDEX_JSON}"; exit 1; }
          ATTS="$(echo "${INDEX_JSON}" | jq -r '.manifests[] | select(.annotations["vnd.docker.reference.type"]=="attestation-manifest") | .digest')"
          echo "attestation manifests: ${ATTS}"
          # GHCR is eventually consistent: freshly pushed attestation manifests can
          # 404 briefly even when listed in the index — retry the whole scan
          FOUND=0
          for attempt in 1 2 3 4 5 6; do
            # anonymous pull tokens are short-lived (~5 min): refresh per attempt
            TOKEN="$(curl -sS --retry 3 --retry-delay 5 "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY}:pull" | jq -r .token)"
            for att in ${ATTS}; do
              for layer in $(curl -sS --retry 3 --retry-delay 5 -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.oci.image.manifest.v1+json" "https://ghcr.io/v2/${GITHUB_REPOSITORY}/manifests/${att}" | jq -r '.layers[].digest'); do
                PT="$(curl -sS --retry 3 --retry-delay 5 -H "Authorization: Bearer ${TOKEN}" "https://ghcr.io/v2/${GITHUB_REPOSITORY}/blobs/${layer}" | jq -r .predicateType)"
                if [ "${PT}" = "https://slsa.dev/provenance/v1" ]; then FOUND=1; fi
              done
            done
            [ "${FOUND}" = "1" ] && break
            echo "provenance scan attempt ${attempt} found nothing yet; waiting 20s"; sleep 20
          done
          [ "${FOUND}" = "1" ] || { echo "no SLSA provenance layer found in the index"; exit 1; }
          echo "SLSA provenance layer verified in the index"
      - name: Attach the SBOM file to the GitHub release (v* only, P7-003)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" sbom.spdx.json --clobber
