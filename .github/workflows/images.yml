# P7-002: signed multi-arch images. A v* tag (or a manual dispatch for the
# trial acceptance) builds linux/amd64+linux/arm64, pushes to GHCR, signs
# the multi-arch index digest with keyless cosign (GitHub OIDC), then
# verifies the signature against the strict certificate identity (this
# repository, this workflow file, the exact ref) and inspects the index.
# P7-003: the build also attests an SBOM and SLSA provenance; both are
# verified with cosign and the SBOM file is attached to the v* release.
name: images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach the SBOM to the v* GitHub release
  id-token: write # keyless cosign (OIDC)
  packages: write # GHCR push

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags and signer identity
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "identity=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/images.yml@${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          else
            # trial acceptance run (workflow_dispatch): a SHA-bound tag that
            # never touches published release tags or latest
            TRIAL="trial-$(git rev-parse --short HEAD)"
            echo "tags=${IMAGE}:${TRIAL}" >> "$GITHUB_OUTPUT"
            echo "identity=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/images.yml@${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push the multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the multi-arch index digest (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Verify the signature (strict identity)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity "${{ steps.meta.outputs.identity }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Inspect the pushed index (both platforms)
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
      - name: Download the SBOM attestation (P7-003)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # attestations attach to the per-platform manifests, not the index:
          # target the amd64 manifest digest explicitly
          AMD64="$(docker buildx imagetools inspect "${IMAGE}@${{ steps.build.outputs.digest }}" --format "{{json .}}" | jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest')"
          cosign download sbom "${IMAGE}@${AMD64}" > sbom.spdx.json
          head -c 400 sbom.spdx.json
      - name: Verify the SLSA provenance attestation (P7-003)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          AMD64="$(docker buildx imagetools inspect "${IMAGE}@${{ steps.build.outputs.digest }}" --format "{{json .}}" | jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest')"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity "${{ steps.meta.outputs.identity }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${AMD64}"
      - name: Attach the SBOM file to the GitHub release (v* only, P7-003)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" sbom.spdx.json --clobber
