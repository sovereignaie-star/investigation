name: d052-experiment
# D-052 (P2-003): controlled paired experiment. Runs the full `test:coverage`
# command at a fixed SHA twice per pair: (a) exactly the CI command, and
# (b) the same command with ONLY `--fileParallelism=false` added. No other
# variables change (same checkout, same Node, same install, same runner
# image). Triggers manually (workflow_dispatch) so it never runs as part of
# PR CI. Three pairs per invocation (alternating order: A/B, B/A, A/B) to
# guard against warm-up and cache effects.
#
# Owner constraints honoured: the 5000ms timeout and the KDF parameters are
# NOT changed; the test is NOT split; the regular CI workflow is untouched.
#
# Result semantics:
#   - If (a) fails and (b) passes consistently across pairs, the hypothesis
#     "V8 coverage + full file parallelism on a shared runner is the cause"
#     is confirmed at the same SHA.
#   - If both fail or both pass consistently, the hypothesis is falsified and
#     the remaining candidate is coverage instrumentation cost alone (or
#     something else entirely), to be narrowed next.
#   - Mixed results point to runner contention variance; the pair logs
#     (uploaded as artifacts) carry the raw durations for offline analysis.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to run the experiment at (defaults to the default branch head)"
        required: false
        default: ""
      pairs:
        description: "Number of A/B pairs (default 3)"
        required: false
        default: "3"
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.sha || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record the experiment identity (D-052)
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "runner_image=$(cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2)"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "cpu_count=$(nproc)"
            echo "pairs=${{ github.event.inputs.pairs || '3' }}"
          } | tee experiment-identity.txt
      - name: Run the paired A/B experiment (D-052)
        run: |
          # `set -u` (undefined var = error) AND `set +e` (explicitly DISABLE
          # errexit): GitHub runners may enable `-e` by default; if a vitest
          # run fails (which is DATA for this experiment, not an error), the
          # loop must CONTINUE so all pairs complete and the logs carry the
          # verdict. We restore the original shell opts at the end.
          set -u
          set +e
          PAIRS="${{ github.event.inputs.pairs || '3' }}"
          mkdir -p d052-results
          : > d052-results/d052-durations.txt
          : > d052-results/d052-expected.txt
          for i in $(seq 1 "$PAIRS"); do
            # Alternate the order each pair: pair 1 A-then-B, pair 2 B-then-A, ...
            if [ $(( i % 2 )) -eq 1 ]; then FIRST=a; SECOND=b; else FIRST=b; SECOND=a; fi
            for WHICH in "$FIRST" "$SECOND"; do
              LABEL="pair${i}-${WHICH}"
              # vitest supports MULTIPLE reporters in one run: the default text
              # reporter (what the user sees in the log) AND a JSON reporter
              # writing to a file. The JSON comes from THE SAME RUN that produces
              # the exit code — the durations and the exit status are from one
              # execution, not two.
              # - (a) the exact CI command PLUS a JSON reporter (the JSON reporter
              #   does not change test behaviour or parallelism).
              # - (b) the same command with ONLY --fileParallelism=false added.
              #   (Called via `pnpm exec` so the flag reaches vitest directly.)
              # The JSON output path is per-run so both files are kept.
              if [ "$WHICH" = "a" ]; then
                pnpm exec vitest run --coverage \
                  --reporter=default --reporter=json \
                  --outputFile.json="d052-results/${LABEL}.json" 2>&1 | tee "${LABEL}.log"
                STATUS="${PIPESTATUS[0]}"
              else
                pnpm exec vitest run --coverage --fileParallelism=false \
                  --reporter=default --reporter=json \
                  --outputFile.json="d052-results/${LABEL}.json" 2>&1 | tee "${LABEL}.log"
                STATUS="${PIPESTATUS[0]}"
              fi
              echo "exit=$STATUS" >> "${LABEL}.log"
              echo "${LABEL} exit=$STATUS" >> d052-results/summary.txt
              # Record the SHA and A/B setting WITH the run so the JSON, the exit
              # code and the durations are all bound to the same execution.
              echo "${LABEL} sha=$(git rev-parse HEAD) ab=${WHICH} exit=$STATUS json=d052-results/${LABEL}.json" >> d052-results/summary.txt
              # Structured JSON report from THE SAME RUN (the PRIMARY evidence —
              # the text grep below is only a fallback because vitest's text
              # output is parallelised and may drop slow-test lines).
              # vitest supports multiple reporters: the default text reporter
              # (what the user sees) AND a JSON reporter writing to a file.
              # The JSON comes from THE SAME RUN that produced
              # the exit code — not a separate one.
              # Extract the D-052 durations from the STRUCTURED JSON of THIS
              # SAME RUN (both
              # plain AND encrypted are present — the loop is over the test
              # results in the JSON, not over the grep output).
              node -e '
                const fs = require("node:fs");
                const label = process.argv[1];
                const file = `d052-results/${label}.json`;
                if (!fs.existsSync(file)) { console.error("MISSING_JSON", file); process.exit(1); }
                const r = JSON.parse(fs.readFileSync(file, "utf8"));
                const tests = r.testResults || [];
                const d052 = [];
                function walk(t) {
                  const nm = t.fullName || t.title || "";
                  if (/a creation that fails at any step/.test(nm)) d052.push(t);
                  for (const c of t.assertionResults || []) {
                    if (/a creation that fails at any step/.test(c.fullName || c.title || "")) {
                      d052.push({ fullName: c.fullName || c.title, duration: c.duration, status: c.status });
                    }
                  }
                }
                for (const t of tests) walk(t);
                const out = fs.createWriteStream("d052-results/d052-durations.txt", { flags: "a" });
                for (const t of d052) {
                  const nm = t.fullName || "";
                  const variant = /encrypted:/.test(nm) ? "encrypted" : "plain";
                  const dur = t.duration !== undefined && t.duration !== null ? Math.round(t.duration) : "unknown";
                  out.write(`${label} variant=${variant} duration_ms=${dur} status=${t.status}\n`);
                }
                out.end();
              ' "${LABEL}" || echo "${LABEL} json_parse_error" >> d052-results/d052-durations.txt
            done
          done
          # Verify the report is COMPLETE: every run must have BOTH plain AND
          # encrypted durations. With N runs, expect 2*N rows (N runs x 2
          # variants each). If any are missing, record it (do NOT fail the
          # workflow — the analysis is the deliverable).
          PAIRS_N=$(( PAIRS * 2 ))
          ROWS=$(grep -c "duration_ms=" d052-results/d052-durations.txt || echo 0)
          if [ "$ROWS" -lt "$PAIRS_N" ]; then
            echo "INCOMPLETE: expected ${PAIRS_N} rows, got ${ROWS}" >> d052-results/d052-durations.txt
          else
            echo "COMPLETE: ${ROWS}/${PAIRS_N} rows" >> d052-results/d052-durations.txt
          fi
          # Never fail the workflow on the experiment itself: the analysis is the
          # deliverable, not a pass/fail gate. The logs carry the verdict.
          exit 0
      - name: Upload the experiment logs (D-052)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d052-experiment-logs
          path: |
            experiment-identity.txt
            d052-results/summary.txt
            d052-results/d052-durations.txt
            pair*.log
            d052-results/pair*.json
          if-no-files-found: warn
